<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI 태그 아카이브</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #252525;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-color: #4CAF50;
            --danger-color: #cf6679;
            --border-color: #2d2d2d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #ffffff;
        }

        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 인스타그램 스타일 메인 그리드 */
        .feed-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .feed-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .feed-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .feed-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-no-img {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .feed-title {
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* 팝업(모달) 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
        }

        .editable-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            outline: none;
            flex: 1;
            margin-right: 15px;
            border-bottom: 1px solid transparent;
        }
        .editable-title:focus {
            border-bottom: 1px solid #555;
        }
        .editable-title:empty:before {
            content: "여기를 눌러 제목 입력...";
            color: var(--text-muted);
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            padding-left: 8px;
            border-left: 3px solid #ffffff;
        }

        .prompt-container {
            position: relative;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            padding-top: 35px;
        }

        .editable-prompt {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: break-all;
            outline: none;
            white-space: pre-wrap;
            min-height: 30px;
            color: #e5c07b;
        }
        .editable-prompt:empty:before {
            content: "터치하여 프롬프트 입력...";
            color: #5c6370;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: #333;
            color: #aaa;
            border: 1px solid #444;
            padding: 2px 6px;
            font-size: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .image-wrapper {
            position: relative;
            aspect-ratio: 3 / 4;
            background-color: var(--input-bg);
            border: 1px dashed #444;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .upload-placeholder {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            pointer-events: none;
            z-index: 1;
        }

        .file-input { display: none; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 3000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>NAI 태그 보관함</h1>
            <button class="add-btn" onclick="createNewPost()">+ 새 세트 추가</button>
        </div>

        <!-- 인스타그램 그리드 피드 리스트 -->
        <div id="feed-list" class="feed-grid"></div>
    </div>

    <!-- 상세 내용 및 편집용 팝업 창 -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div id="modal-title" class="editable-title" contenteditable="true" oninput="onModalTextChange('title', this)"></div>
                <button class="delete-btn" id="modal-delete-btn">삭제</button>
                <button class="modal-close-btn" onclick="closeActiveModal()">×</button>
            </div>
            <div id="modal-body-content"></div>
        </div>
    </div>

    <div class="toast" id="toast">복사 완료!</div>
